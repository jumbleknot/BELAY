# Protection manifest — the authoritative concepts of the openwiki/ bundle.
#
# Every concept is EXACTLY ONE of:
#   - derived: it carries a `resource` front-matter field naming the one file it summarises; or
#   - authoritative: it carries no `resource` and is listed below. It is the canonical home of its
#     subject, so a new learning about that subject is written into the concept itself.
# The rule for where a new learning goes (openwiki/INSTRUCTIONS.md, section 7) is undecidable
# without this list.
#
# A SIDECAR on purpose: protection that lived inside the concept it guards could be stripped by the
# edit it exists to constrain, and a stripped marker reads as "not protected" rather than as a failure.
#
# ENFORCED by scripts/check-openwiki-governance.mjs, in `scripts:lint` (the required `guardrails`
# check): a page that is neither derived nor listed here, or both, fails G11. A load-bearing passage
# may also be protected under `passages:` ({concept, anchor, fingerprint}); a reworded or removed one
# then fails G5/G6 until its fingerprint is updated in the same change. Compute a fingerprint with
# `node scripts/check-openwiki-governance.mjs --fingerprint openwiki/<concept> "<heading>"`; never
# hand-type one. No passage is protected yet.
#
# The four reserved bundle files (index.md, INSTRUCTIONS.md, quickstart.md, log.md) are not concepts
# and are not listed.

version: 1

authoritative:
  - "gotchas/env-file-inline-comments.md"
  - "gotchas/instrument-traps.md"
  - "invariants/feature-validation-checklist.md"
  - "invariants/nx-task-runner.md"
  - "invariants/package-manager-enforcement.md"
  - "invariants/rtk-token-compression.md"
  - "invariants/secrets-management.md"
  - "invariants/testing-tiers.md"
  - "invariants/unenforced-rules.md"
  - "process/pull-request-batching.md"
  - "process/spec-driven-development.md"
  - "process/test-authoring-conventions.md"
  - "process/wiki-maintenance.md"
  - "projects/repository.md"
