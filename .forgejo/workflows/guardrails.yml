# Guardrails: the checks every change to BELAY must pass. Branch protection on `main` requires this
# workflow's status (docs/runbooks/ci.md).
#
# ACTION-LIGHT by design: `uses:` is kept to actions mirrored on the Forgejo instance's default
# action registry (actions/checkout, actions/setup-node, and actions/upload-artifact in `sast`), so
# this workflow runs on the homelab runner without pointing action resolution at github. Each is
# pinned by commit SHA.
#
# Runner: `belay` is the label of BELAY's own repository-scoped runner (ci-belay), mapped on the
# host to a node:26-bookworm container. Jobs never queue on the shared global runner.
#
# Toolchain: setup-node still pins the constitution's exact Node (26.13.1) here in the repo, where
# it is reviewed and tested; the runner's image only sets the major. pnpm comes from
# scripts/install-pnpm.sh at exactly package.json `packageManager` (Node 26 has no corepack).
#
# Every check runs through the `scripts` Nx project (scripts/project.json), as the constitution's
# "Monorepo Build Tool" rule requires. Each wrapped step's output is mirrored by
# scripts/ci-log-step.sh into the per-step log the failure digest reads.
name: guardrails

on:
  workflow_dispatch: {}
  # `push` is scoped to `main`; `pull_request` stays unscoped. WHY: with a bare `push:`, pushing a
  # branch that has an open PR fires BOTH events, so guardrails would run TWICE per push. The two
  # runs would not even cancel each other: `concurrency` keys on `github.ref`, which differs
  # between the events.
  #
  # This is BRANCH scoping, not path scoping: every check still runs over the WHOLE tree, on every
  # PR and on every push to `main`. Branch protection is unaffected, because a PR's required
  # guardrails status comes from the `pull_request` event.
  #
  # Accepted trade-off: a push to a branch with NO open PR is not checked. It cannot reach `main`
  # without a PR (protected), and opening one runs every check before merge.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: belay
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node (constitution pin)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1
      - name: Install pnpm (version from package.json packageManager)
        run: bash scripts/ci-log-step.sh guardrails-install-pnpm bash scripts/install-pnpm.sh
      - name: Install workspace dependencies (frozen lockfile)
        run: bash scripts/ci-log-step.sh guardrails-install-deps pnpm install --frozen-lockfile
      - name: Gates and selftests (scripts:lint)
        run: bash scripts/ci-log-step.sh guardrails-lint pnpm nx run scripts:lint
      - name: Script unit tests (scripts:test)
        run: bash scripts/ci-log-step.sh guardrails-test pnpm nx run scripts:test
      # The pdlc operator-tool MCP server (feature 014, ADR-0005). Its live-forge tier is
      # operator-run in the dev container (docs/runbooks/pdlc.md) and never runs here.
      - name: pdlc server lint (pdlc:lint)
        run: bash scripts/ci-log-step.sh guardrails-pdlc-lint pnpm nx run pdlc:lint
      - name: pdlc server unit and contract tests (pdlc:test)
        run: bash scripts/ci-log-step.sh guardrails-pdlc-test pnpm nx run pdlc:test
      # Feature 016 (research M9, ADR-0006): pdlc:integration runs the target repository's real Spec Kit PowerShell
      # scripts, and this runner image has no pwsh. A version-pinned, sha256-verified install (never a piped
      # installer); the pin lives in scripts/install-pwsh.mjs and Renovate moves it with the dev container's.
      - name: Install pwsh (pinned; Spec Kit's scripts in pdlc:integration)
        run: |
          bash scripts/ci-log-step.sh guardrails-install-pwsh bash -e /dev/stdin <<'CI_LOG_STEP'
          node scripts/install-pwsh.mjs "$HOME/.local/pwsh"
          echo "$HOME/.local/pwsh" >> "$GITHUB_PATH"
          CI_LOG_STEP
      - name: pdlc server real-git integration (pdlc:integration)
        run: bash scripts/ci-log-step.sh guardrails-pdlc-integration pnpm nx run pdlc:integration
      # Publish an agent-readable failure digest. The forge API exposes no log or artifact endpoint,
      # so each job PUSHES a distilled, redacted digest into a channel the API can already read: a PR
      # comment, or a commit status on push. `always()` + `continue-on-error` + an unconditional
      # exit 0 inside the script: a broken digest must NEVER mask, replace or delay the real job
      # result. `job.status` carries `cancelled` for a superseded run, which the script suppresses
      # rather than publishing a failure for a commit that was never broken.
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # Fallback: when the secret above is empty (a run from a ref that gets no secrets), the
          # digest publishes with this run-provisioned token instead. Without this line the fallback
          # is dead code: the script reads GITHUB_TOKEN from the step env, and nothing else puts it
          # there.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs

  # SAST + SCA, stage 1 (feature 006, backlog item #37; baseline: MovieCollectionManager's feature-033
  # `sast` job). Keyless: Semgrep code SAST over the whole tree and `pnpm audit` over the JS
  # lockfile, normalized to one Critical/High/Medium/Low scale and gated against
  # security/sast/allowlist.yaml (the allowlist IS the baseline). Fails on an un-allowlisted
  # High/Critical blocking finding (SAST, or runtime-scope SCA); Medium/Low and dev-scope findings are
  # warnings, with one exception: on a PR, a package the change moves INTO an advisory's vulnerable
  # range blocks in any scope (the dependency-downgrade step, feature 007).
  # SCA runs FULL every time: a newly published advisory can hit an unchanged dependency.
  # Semgrep is changed-files on PRs and full on push. The enabled scanners are a list in
  # security/sast/scan.yaml: cargo-audit (stage 2) and pip-audit (stage 3) are a list entry there, nothing
  # else; their toolchain steps are already below, dormant until a lockfile is tracked (feature 008).
  # A separate job, so `guardrails / guardrails` keeps its time.
  sast:
    runs-on: belay
    timeout-minutes: 15
    steps:
      - name: Checkout (full history, so the PR-base diff for the changed-files scope resolves)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node (constitution pin)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1
      - name: Ensure the PR base ref is available for the changed-files diff
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci-log-step.sh sast-fetch-base-ref git fetch --no-tags --depth=200 origin "$BASE_REF"
      - name: Install pnpm (version from package.json packageManager)
        run: bash scripts/ci-log-step.sh sast-install-pnpm bash scripts/install-pnpm.sh
      # uv carries Semgrep (`uvx semgrep@<pin>`). The maintainer approved uv on the runner on
      # 2026-11-23 (item #37). The installer URL is version-pinned; the belay-ci-curl-pipe-shell rule
      # accepts exactly this pinned form and fails any unpinned piped installer.
      - name: Install uv (pinned; carries Semgrep through uvx)
        run: |
          bash scripts/ci-log-step.sh sast-install-uv bash -e /dev/stdin <<'CI_LOG_STEP'
          curl -LsSf https://astral.sh/uv/0.13.9/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          CI_LOG_STEP
      - name: Install workspace dependencies (frozen lockfile; pnpm audit reads it)
        run: bash scripts/ci-log-step.sh sast-install-deps pnpm install --frozen-lockfile
      # Feature 011, the dependency bot's two PR checks.
      # (1) renovate.json is validated STRICTLY at the bot's pinned version on every PR, so an invalid
      #     edit cannot merge. A bot PR that bumps RENOVATE_VERSION validates the config with the NEW
      #     version here, before anything runs it. `--no-global` is load-bearing: without it the file is
      #     read as a global config and a stale key exits 0 (MCM measured this).
      # (2) A version-and-checksum pair (Trivy, rustup-init, cargo-audit) that moved must agree with its
      #     release, cross-checked against the publisher's checksum. A PR that moved the version alone
      #     cannot merge. It downloads only when a pair moved (research R7).
      - name: Validate renovate.json (strict, at the pinned version)
        run: bash scripts/ci-log-step.sh sast-renovate-config npx --yes --before="$(node -e 'process.stdout.write(new Date(Date.now()-3*864e5).toISOString())')" --package renovate@$(node scripts/check-renovate-config.mjs --print-renovate-version) -- renovate-config-validator --strict --no-global renovate.json
      - name: Verify version-and-checksum pairs (only those that moved)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: bash scripts/ci-log-step.sh sast-pin-checksums node scripts/refresh-pin-checksum.mjs --verify-changed --base "origin/$BASE_REF"
      # Stages 2 and 3, prepared and DORMANT (feature 008; items #39, #40). Each step installs only when
      # its lockfile is tracked (a Cargo.lock; a uv.lock under a project directory), discovered exactly
      # as the scanners discover them, so today both say "nothing to prepare" and exit 0. Unconditional
      # here on purpose: the decision is the tracked files, which an `if:` cannot see. Rust arrives from
      # a version-pinned, sha256-verified rustup-init and the prebuilt cargo-audit, never a piped
      # installer and never a compile; the pins live in scripts/sast-prepare.mjs. After the workspace
      # install because the script imports sast-scan.mjs, and after uv because python runs `uv sync`.
      - name: Prepare the Rust toolchain and cargo-audit (only when a Cargo.lock is tracked)
        run: bash scripts/ci-log-step.sh sast-prepare-rust node scripts/sast-prepare.mjs rust
      - name: Sync each Python project's env (only when a project uv.lock is tracked)
        run: bash scripts/ci-log-step.sh sast-prepare-python node scripts/sast-prepare.mjs python
      - name: Gate selftest (prove the fail, suppress and expiry paths before the real scan)
        run: bash scripts/ci-log-step.sh sast-gate-selftest node scripts/check-sast-findings.mjs --selftest
      - name: Orchestrator selftest (known scanner output must be reported, offline)
        run: bash scripts/ci-log-step.sh sast-scan-selftest node scripts/sast-scan.mjs --selftest
      - name: Custom-rule fixtures (semgrep --test; a rule with no fixture fails)
        run: bash scripts/ci-log-step.sh sast-rule-fixtures node scripts/sast-scan.mjs --test-rules
      - name: Static scan (Semgrep changed-files on PRs, full on push; SCA always full)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          bash scripts/ci-log-step.sh sast-static-scan bash -e /dev/stdin <<'CI_LOG_STEP'
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/sast-scan.mjs --scope changed --base "origin/$BASE_REF"
          else
            node scripts/sast-scan.mjs --scope full
          fi
          CI_LOG_STEP
      - name: Gate (fail on any un-allowlisted High/Critical blocking finding)
        run: bash scripts/ci-log-step.sh sast-gate node scripts/check-sast-findings.mjs
      # Feature 007 (item #43): a PR must not move a package INTO a known advisory, in ANY scope. The
      # gate above never blocks a dev-scope finding, so a bump that re-resolves some other package down
      # into an advisory stays green there. This compares the base and head lockfiles against the
      # advisory ranges the scan above already fetched. PR-only: a push has no base to have regressed
      # from. The base ref was fetched by the "Ensure the PR base ref" step.
      - name: Gate (no package resolution moves INTO a known advisory, any scope)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci-log-step.sh sast-downgrade-gate node scripts/check-dependency-downgrade.mjs --base "origin/$BASE_REF"
      - name: Upload scan reports (findings.json, SARIF, summary, native output)
        if: ${{ always() }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: sast-report
          path: security/sast/reports/
          retention-days: 14
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs
