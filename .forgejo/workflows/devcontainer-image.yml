# Dev-container toolchain image publish (feature 004).
#
# Builds the heavy, build-once dev image from .devcontainer/toolchain.Dockerfile in CI and pushes it
# (tag + immutable @sha256 digest) to the forge registry as `belay-devcontainer`. The sandbox VM pins
# that digest in its env file (BELAY_DEVCONTAINER_IMAGE), so a dev-container recreate is a pull, not
# a rebuild. The image carries no credential and no personal tool. Build in CI (or on a host engine
# with open egress), never inside the sandbox: rustup's hosts are not allowlisted there (research R5).
#
# ⚠️ RUNNER EXCEPTION — AND THE RULE THAT MAKES IT SAFE.
# Every other BELAY job runs on BELAY's own runner (`runs-on: belay`), which runs each job in a fresh
# container with no host Docker access. This job needs a Docker daemon, so it runs on the shared
# host runner (`kvm`), which has the host's rootless Docker. PULL-REQUEST CODE MUST THEREFORE NEVER
# RUN HERE: the triggers are push to a protected branch, manual dispatch and the schedule only.
# Adding `pull_request` or `pull_request_target` would let a PR reach the host's Docker daemon.
# Pinned by scripts/__tests__/devcontainer-image-workflow.guard.test.mjs.
#
# A `packageManager` bump is a toolchain change too: the image installs pnpm at that pin. Path
# filters cannot see inside package.json, so it is in `paths:`, and the `gate` step stops the run
# after checkout unless the packageManager value itself moved (scripts/devcontainer-image-gate.mjs).
#
# Reading the result: this forge cannot read back the step summary, so resolve the digest from the
# registry's manifests endpoint (docs/runbooks/devcontainer.md, "Re-pin the image").
name: devcontainer-image

on:
  workflow_dispatch:
  push:
    # main ONLY: it is protected (no direct push; changes arrive through reviewed PRs). A push to any
    # other branch must not run its own toolchain.Dockerfile on the host runner. A branch build is
    # still possible by manual dispatch, which needs write access.
    branches: [main]
    # Keep in step with IMAGE_INPUTS in scripts/devcontainer-image-gate.mjs (+ package.json, gated).
    paths:
      - '.devcontainer/toolchain.Dockerfile'
      - '.devcontainer/Dockerfile'
      - '.forgejo/workflows/devcontainer-image.yml'
      - 'scripts/install-pnpm.sh'
      - 'scripts/devcontainer-image-gate.mjs'
      - 'package.json'
  schedule:
    # Weekly refresh (Friday 06:00 UTC): picks up base-image and toolchain security patches even
    # when nothing in the repository changed. Cron is UTC-only and does not observe DST.
    - cron: '0 6 * * 5'

concurrency:
  group: devcontainer-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-publish:
    # The shared, Docker-capable host runner. See the RUNNER EXCEPTION note above.
    runs-on: kvm
    timeout-minutes: 60
    env:
      # The ci user's rootless Docker daemon on the host runner (adjust 1001 if `id -u ci` differs).
      DOCKER_HOST: unix:///run/user/1001/docker.sock
      # Host-free registry coordinates: repository variables, never a git literal.
      REGISTRY: ${{ vars.REGISTRY }}
      NS: ${{ vars.NS }}
      REGISTRY_USER: ${{ vars.REGISTRY_USER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The gate diffs against the push's `before` sha, which a depth-1 clone does not contain.
          fetch-depth: 0

      # Pin Node: without this the job runs the host runner's implicit Node, not the repository's.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1

      - name: Decide whether the image inputs changed
        id: gate
        env:
          GATE_BEFORE: ${{ github.event.before }}
        run: bash scripts/ci-log-step.sh devcontainer-image-gate node scripts/devcontainer-image-gate.mjs

      - name: Check the Docker CLI reaches the runner's daemon
        if: steps.gate.outputs.build == 'true'
        run: |
          bash scripts/ci-log-step.sh build-publish-check-docker bash -e /dev/stdin <<'CI_LOG_STEP'
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker CLI not found on the runner"; exit 1
          fi
          docker version >/dev/null || { echo "::error::cannot reach the Docker daemon at $DOCKER_HOST"; exit 1; }
          CI_LOG_STEP

      - name: Build the toolchain image
        if: steps.gate.outputs.build == 'true'
        run: |
          bash scripts/ci-log-step.sh devcontainer-image-build bash -e /dev/stdin <<'CI_LOG_STEP'
          : "${REGISTRY:?set the REGISTRY repository variable}" "${NS:?set the NS repository variable}"
          TAG="${REGISTRY}/${NS}/belay-devcontainer:${GITHUB_SHA}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build -f .devcontainer/toolchain.Dockerfile -t "$TAG" .
          CI_LOG_STEP

      # Feature 010: the builder scans its own image BEFORE the push (spec clarification). A fixable
      # Critical with no allowlist entry fails the gate, a failed step stops the job, and `Push` never
      # runs, so no vulnerable digest exists for anyone to re-pin onto. The image is read from the
      # local daemon, so no --platform is forced: it is whatever this runner built.
      #
      # The scan scripts import `yaml`, so the workspace dependencies come first. Without them the
      # scan died with ERR_MODULE_NOT_FOUND and the push was skipped only because the step crashed:
      # that looks like the gate working, but no image was judged.
      # workflow-deps-installed.guard.test.mjs fails any job that repeats this.
      # Into a JOB-PRIVATE prefix, never the global one (item #79): on this shared host runner the global
      # prefix is the Node in the host's tool cache, which other projects' jobs also run, so a global
      # install changes their pnpm. host-runner-shared-state.guard.test.mjs pins this, and the cleanup
      # step at the end of the job.
      - name: Install pnpm (version from package.json packageManager)
        if: steps.gate.outputs.build == 'true'
        env:
          PNPM_PREFIX: ${{ runner.temp }}/belay-pnpm
        run: bash scripts/ci-log-step.sh build-publish-install-pnpm bash scripts/install-pnpm.sh

      - name: Install workspace dependencies (frozen lockfile)
        if: steps.gate.outputs.build == 'true'
        run: bash scripts/ci-log-step.sh build-publish-install-deps pnpm install --frozen-lockfile

      # Trivy, its database and the registry login are job-private too (item #84): the other project's host jobs
      # install and run their own Trivy from the shared ~/.local/bin and use the shared ~/.cache/trivy,
      # so a Trivy bump on either side would swap the other's binary, even mid-scan.
      - name: Install Trivy (pinned, sha256-verified)
        if: steps.gate.outputs.build == 'true'
        env:
          BELAY_TRIVY: ${{ runner.temp }}/belay-trivy
        run: |
          bash scripts/ci-log-step.sh build-publish-install-trivy bash -e /dev/stdin <<'CI_LOG_STEP'
          node scripts/install-trivy.mjs "$BELAY_TRIVY/bin"
          echo "$BELAY_TRIVY/bin" >> "$GITHUB_PATH"
          CI_LOG_STEP

      - name: Scan the built image (gates the push)
        if: steps.gate.outputs.build == 'true'
        env:
          BELAY_TRIVY: ${{ runner.temp }}/belay-trivy
          TRIVY_CACHE_DIR: ${{ runner.temp }}/belay-trivy/cache
        run: |
          bash scripts/ci-log-step.sh build-publish-image-scan bash -e /dev/stdin <<'CI_LOG_STEP'
          # The Trivy that runs must be the one this job installed, not a shared one earlier on PATH.
          [ "$(command -v trivy)" = "$BELAY_TRIVY/bin/trivy" ] || { echo "::error::trivy on PATH is $(command -v trivy), not this job's $BELAY_TRIVY/bin/trivy"; exit 1; }
          node scripts/image-scan.mjs --image "$TAG" --image-src docker
          node scripts/check-image-findings.mjs
          CI_LOG_STEP

      - name: Upload the image-scan report
        if: always() && steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: image-scan-report
          path: security/images/reports/
          retention-days: 14

      - name: Push (tag + digest) and report the pinned reference
        if: steps.gate.outputs.build == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          # The login is written HERE, never to the shared ~/.docker/config.json (item #84).
          DOCKER_CONFIG: ${{ runner.temp }}/belay-docker
        run: |
          bash scripts/ci-log-step.sh build-publish-push bash -e /dev/stdin <<'CI_LOG_STEP'
          : "${REGISTRY_USER:?set the REGISTRY_USER repository variable}"
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          docker push "$TAG"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$TAG" | cut -d'@' -f2)"
          PINNED="${REGISTRY}/${NS}/belay-devcontainer@${DIGEST}"
          echo "Published dev-container toolchain image:"
          echo "  tag    : $TAG"
          echo "  digest : $DIGEST"
          {
            echo "## Dev-container toolchain image published"
            echo ""
            echo "Set BELAY_DEVCONTAINER_IMAGE in the sandbox VM's ~/.belay-sandbox-env to the digest-pinned ref:"
            echo ""
            echo '```'
            echo "BELAY_DEVCONTAINER_IMAGE=$PINNED"
            echo '```'
            echo ""
            echo "Then recreate the dev container. See docs/runbooks/devcontainer.md."
          } >> "$GITHUB_STEP_SUMMARY"
          CI_LOG_STEP

      # Items #79 and #84: nothing this job installed, cached or logged in with outlives it on the
      # shared host. Every runner.temp path above must be named here (the guard checks).
      - name: Remove the job-private tools, cache and login
        if: always() && steps.gate.outputs.build == 'true'
        env:
          PNPM_PREFIX: ${{ runner.temp }}/belay-pnpm
          BELAY_TRIVY: ${{ runner.temp }}/belay-trivy
          DOCKER_CONFIG: ${{ runner.temp }}/belay-docker
        run: bash scripts/ci-log-step.sh build-publish-remove-private rm -rf "$PNPM_PREFIX" "$BELAY_TRIVY" "$DOCKER_CONFIG"

      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs
