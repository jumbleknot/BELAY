# Package-registry retention. Read by scripts/registry-retention.mjs, run weekly by
# .forgejo/workflows/registry-retention.yml. Runbook: docs/runbooks/devcontainer.md.
#
# `mode: report`: the job prints what it would keep and delete, and deletes nothing. --apply deletes
# only when this says `mode: apply`, and flipping it is its own one-line PR that links a reviewed
# report.
#
# Per package, a version is kept by the FIRST reason that applies, else deleted:
#   keep:protected   its digest is listed under `protect:` below
#   keep:newest      among the newest `keepNewest` tags
#   keep:recent      younger than `keepDays`
#   keep:referenced  (container children) a kept index points at it — whatever its age
# When any kept index cannot be read, no child of that package is deleted (keep:unverified).
# A package not listed here (another repository's, under the same owner) is reported and never
# deleted. A `protect:` digest that is not in the registry stops the run: nothing is deleted (exit 5).
mode: report
owner: jumbleknot
# The evidence the evidence bundles must cover. An evidence package's window below it is refused.
evidenceWindowDays: 45
# Digests that survive every rule: { package, digest: sha256:<64 hex>, note }. The sandbox's image
# pin lives in the VM's env file, which is never committed (it carries the registry host), so the
# re-pin step in docs/runbooks/devcontainer.md records the pinned digest here. A digest is neither a
# secret nor a host. Until one is recorded, the newest 4 / 21 days below is what keeps a pin alive.
protect: []
packages:
  # The dev-container toolchain image: the newest 4 (about a month of the weekly rebuild) or 21
  # days, whichever keeps more, plus every protected digest.
  - { name: belay-devcontainer, type: container, keepNewest: 4, keepDays: 21 }
  # Evidence bundles. ci-failure-digest.mjs ALREADY prunes these at its RETENTION_DAYS (30) on every
  # publish, so this rule is the floor `ci-status durations` needs, not the deleter: 25 runs × 4
  # bundle-publishing jobs (guardrails, sast, devcontainer-image, registry-retention) = 100. The script
  # refuses anything below the product, so a new job that publishes a bundle fails the config until
  # this is raised.
  - { name: belay-ci-failures, type: generic, keepNewest: 100, keepDays: 45 }
