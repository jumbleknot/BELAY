installed:
- git
hooks:
  before_specify:
  - extension: git
    command: speckit.git.feature
    enabled: true
    optional: false
  after_specify:
  - extension: acme
    command: speckit.acme.notify
    enabled: true
    optional: false
  - extension: acme
    command: speckit.acme.optional-extra
    enabled: true
    optional: true
